apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: fedora-cbt-vm
  namespace: cbt-demo
  labels:
    app: fedora-cbt-vm
    changedBlockTracking: "true"
    vm-os: fedora
spec:
  runStrategy: Always
  dataVolumeTemplates:
  - metadata:
      name: fedora-cbt-vm-data
    spec:
      source:
        blank: {}
      pvc:
        accessModes: [ReadWriteOnce]
        volumeMode: Filesystem
        resources:
          requests:
            storage: 10Gi
        storageClassName: ocs-storagecluster-ceph-rbd
  template:
    metadata:
      labels:
        kubevirt.io/vm: fedora-cbt-vm
        app: fedora-cbt-vm
    spec:
      domain:
        cpu:
          cores: 1
        resources:
          requests:
            memory: 1Gi
        devices:
          disks:
          - name: containerdisk
            disk: {bus: virtio}
          - name: cloudinitdisk
            disk: {bus: virtio}
          - name: datadisk
            changedBlockTracking: true
            disk: {bus: virtio}
          interfaces:
          - name: default
            masquerade: {}
      networks:
      - name: default
        pod: {}
      volumes:
      - name: containerdisk
        containerDisk:
          image: quay.io/containerdisks/fedora:41
      - name: cloudinitdisk
        cloudInitNoCloud:
          userData: |
            #cloud-config
            user: fedora
            password: fedora
            chpasswd: {expire: false}
            ssh_authorized_keys:
            - __SSH_PUBLIC_KEY__
            packages:
            - python3
            - sqlite
            write_files:
            - path: /usr/local/bin/vm-validator-workload.py
              permissions: '0755'
              content: |
                #!/usr/bin/env python3
                import hashlib
                import os
                import secrets
                import sqlite3
                import time
                from datetime import datetime, timezone
                BASE = '/var/lib/vm-validator'
                os.makedirs(BASE, exist_ok=True)
                DB = os.path.join(BASE, 'workload.db')
                LOG = os.path.join(BASE, 'workload.log')
                db = sqlite3.connect(DB)
                db.execute('PRAGMA journal_mode=WAL')
                db.execute('CREATE TABLE IF NOT EXISTS heartbeat (seq INTEGER PRIMARY KEY, ts TEXT NOT NULL, payload TEXT NOT NULL, payload_sha256 TEXT NOT NULL)')
                db.commit()
                while True:
                    ts = datetime.now(timezone.utc).isoformat(timespec='milliseconds')
                    seq = db.execute('SELECT COALESCE(MAX(seq), 0) + 1 FROM heartbeat').fetchone()[0]
                    payload = 'sample-%08d-%s' % (seq, secrets.token_hex(8))
                    digest = hashlib.sha256(payload.encode()).hexdigest()
                    db.execute('INSERT INTO heartbeat VALUES (?, ?, ?, ?)', (seq, ts, payload, digest))
                    db.commit()
                    with open(LOG, 'a', encoding='utf-8') as log:
                        log.write('%s %d %s %s\n' % (ts, seq, payload, digest))
                        log.flush()
                    time.sleep(1)
            - path: /usr/local/bin/vm-validator-check.py
              permissions: '0755'
              content: |
                #!/usr/bin/env python3
                import hashlib
                import os
                import sqlite3
                import sys
                BASE = '/var/lib/vm-validator'
                db = sqlite3.connect(os.path.join(BASE, 'workload.db'))
                if db.execute('PRAGMA integrity_check').fetchone()[0] != 'ok': sys.exit('sqlite integrity failure')
                rows = db.execute('SELECT seq, ts, payload, payload_sha256 FROM heartbeat ORDER BY seq').fetchall()
                if len(rows) < 2: sys.exit('not enough heartbeat rows')
                for expected, (seq, ts, payload, digest) in enumerate(rows, 1):
                    if seq != expected or not ts.endswith(('+00:00', 'Z')) or not payload.startswith('sample-') or hashlib.sha256(payload.encode()).hexdigest() != digest:
                        sys.exit('invalid or polluted heartbeat row')
                with open(os.path.join(BASE, 'workload.log'), encoding='utf-8') as log:
                    lines = [line.split() for line in log if line.strip()]
                if len(lines) < 2 or any(len(line) != 4 for line in lines): sys.exit('invalid workload log')
                print('workload-ok rows=%d log-lines=%d latest-seq=%d' % (len(rows), len(lines), rows[-1][0]))
            - path: /etc/systemd/system/vm-validator.service
              content: |
                [Unit]
                Description=VM backup validator workload
                After=local-fs.target
                [Service]
                ExecStart=/usr/local/bin/vm-validator-workload.py
                Restart=always
                RestartSec=1
                [Install]
                WantedBy=multi-user.target
            runcmd:
            - mkdir -p /var/lib/vm-validator
            - systemctl daemon-reload
            - systemctl enable --now vm-validator.service
      - name: datadisk
        dataVolume:
          name: fedora-cbt-vm-data
