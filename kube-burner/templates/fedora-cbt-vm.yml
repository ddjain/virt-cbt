apiVersion: v1
kind: Secret
metadata:
  name: {{.prefix}}-{{.Replica}}-userdata
  labels:
    app.kubernetes.io/name: odf-cbt-validator
    app.kubernetes.io/managed-by: kube-burner
stringData:
  userdata: |
    #cloud-config
    user: {{.user}}
    password: fedora
    chpasswd: {expire: false}
    ssh_authorized_keys:
      - {{.sshPublicKey}}
    packages: [python3, sqlite]
    mounts:
      - [/dev/vdc, /data, xfs, "defaults,nofail", "0", "2"]
    write_files:
      - path: /usr/local/bin/vm-validator.py
        permissions: '0755'
        content: |
          #!/usr/bin/env python3
          import hashlib, os, random, sqlite3, string, time
          root = '/data/vm-validator'
          if os.path.ismount('/data') is False:
              raise SystemExit('/data is not mounted')
          os.makedirs(root, exist_ok=True)
          db = os.path.join(root, 'workload.db')
          log = os.path.join(root, 'workload.log')
          con = sqlite3.connect(db)
          con.execute('CREATE TABLE IF NOT EXISTS records (seq INTEGER PRIMARY KEY, ts TEXT NOT NULL, payload TEXT NOT NULL, digest TEXT NOT NULL)')
          con.commit()
          while True:
              seq = con.execute('SELECT COALESCE(MAX(seq),0)+1 FROM records').fetchone()[0]
              ts = time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime())
              payload = ''.join(random.choice(string.ascii_letters + string.digits) for _ in range(32))
              digest = hashlib.sha256(payload.encode()).hexdigest()
              con.execute('INSERT INTO records VALUES (?,?,?,?)', (seq, ts, payload, digest)); con.commit()
              with open(log, 'a', encoding='utf-8') as out: out.write(f'{seq} {ts} {digest}\\n')
              time.sleep(1)
      - path: /etc/systemd/system/vm-validator.service
        content: |
          [Unit]
          Description=ODF CBT workload validator
          After=data.mount
          [Service]
          Type=simple
          ExecStart=/usr/local/bin/vm-validator.py
          Restart=always
          RestartSec=2
          [Install]
          WantedBy=multi-user.target
    runcmd:
      - mkdir -p /data
      - bash -c 'if ! blkid /dev/vdc | grep -q TYPE; then mkfs.xfs -L data /dev/vdc; fi'
      - bash -c 'mount /data || mount /dev/vdc /data'
      - bash -c 'mountpoint -q /data && mkdir -p /data/vm-validator'
      - bash -c 'mountpoint -q /data && { printf "format=odf-cbt-proof-v1\n"; printf "guest_created_at=%s\n" "$(date -u +%Y-%m-%dT%H:%M:%SZ)"; } > /data/vm-validator/hello.txt && sync -f /data/vm-validator/hello.txt'
      - systemctl daemon-reload
      - systemctl enable --now vm-validator.service
---
apiVersion: kubevirt.io/v1
kind: VirtualMachine
metadata:
  name: {{.prefix}}-{{.Replica}}
  labels:
    app.kubernetes.io/name: odf-cbt-validator
    app.kubernetes.io/managed-by: kube-burner
    vm-os: fedora
    changedBlockTracking: "true"
spec:
  runStrategy: Always
  dataVolumeTemplates:
    - metadata:
        name: {{.prefix}}-{{.Replica}}-data
      spec:
        source: {blank: {}}
        pvc:
          accessModes: [ReadWriteOnce]
          volumeMode: Filesystem
          resources: {requests: {storage: {{.dataSize}}}}
          storageClassName: {{.dataStorageClass}}
  template:
    metadata:
      labels: {app.kubernetes.io/name: odf-cbt-validator, app.kubernetes.io/managed-by: kube-burner, vm-os: fedora}
    spec:
      domain:
        cpu: {cores: {{.cpu}}}
        resources: {requests: {memory: {{.memory}}}}
        devices:
          disks:
            - {name: containerdisk, disk: {bus: virtio}}
            - {name: cloudinitdisk, disk: {bus: virtio}}
            - {name: datadisk, changedBlockTracking: true, disk: {bus: virtio}}
          interfaces: [{name: default, masquerade: {}}]
      {{- if .targetNode }}
      nodeSelector: {kubernetes.io/hostname: {{.targetNode}}}
      {{- end }}
      networks: [{name: default, pod: {}}]
      volumes:
        - {name: containerdisk, containerDisk: {image: {{.image}}}}
        - {name: cloudinitdisk, cloudInitNoCloud: {secretRef: {name: {{.prefix}}-{{.Replica}}-userdata}}}
        - {name: datadisk, dataVolume: {name: {{.prefix}}-{{.Replica}}-data}}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{.prefix}}-{{.Replica}}-backup-output
  labels: {app.kubernetes.io/name: odf-cbt-validator, app.kubernetes.io/managed-by: kube-burner}
spec:
  accessModes: [ReadWriteOnce]
  resources: {requests: {storage: {{.backupSize}}}}
  storageClassName: {{.backupStorageClass}}
---
apiVersion: backup.kubevirt.io/v1alpha1
kind: VirtualMachineBackupTracker
metadata:
  name: {{.prefix}}-{{.Replica}}-tracker
  labels: {app.kubernetes.io/name: odf-cbt-validator, app.kubernetes.io/managed-by: kube-burner}
spec:
  source: {apiGroup: kubevirt.io, kind: VirtualMachine, name: {{.prefix}}-{{.Replica}}}
